name: Release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo test
      - run: cargo build --release
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          "tag=v$($metadata.packages[0].version)" >> $env:GITHUB_OUTPUT
      - name: Publish executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ steps.version.outputs.tag }}' target/release/windows-volume-guard.exe --target $env:GITHUB_SHA --generate-notes
